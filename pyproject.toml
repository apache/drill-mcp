[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drill-mcp"
version = "0.1.0"
description = "MCP server for Apache Drill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # 2.0 renamed FastMCP to MCPServer and moved it to mcp.server.mcpserver;
    # the mcp.server.fastmcp module path this code would need on 1.x does
    # not exist there. No upper cap: a future 3.x doing the same rename
    # again should fail loudly at import with a clear traceback rather than
    # have this package pre-emptively block every install in the meantime.
    "mcp>=2.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
    # mcp itself requires pydantic>=2.12.0 transitively, so 2.6 was never a
    # reachable floor in practice; stated here to match the real minimum.
    "pydantic>=2.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
jdbc = ["jaydebeapi>=1.2.3", "JPype1>=1.5"]
kerberos = ["httpx-gssapi>=0.3"]
dev = ["pytest>=8.0", "respx>=0.21", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
drill-mcp = "drill_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# Existing reviewed code wraps around 88-100 columns already; matching
# that (rather than a larger limit) keeps `ruff format` a no-op on the
# working tree instead of collapsing manually-wrapped, reviewed calls
# onto single long lines.
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes, isort, bugbear, pyupgrade, comprehensions.
select = ["E", "F", "I", "B", "UP", "C4"]
