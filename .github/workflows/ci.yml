name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Deliberately no jdbc/kerberos extras: the suite needs no JVM and no
      # Drill cluster, and installing them here would hide a regression
      # where a test accidentally started depending on one.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

  # Installs the oldest version of every direct dependency the floors in
  # pyproject.toml allow, so a floor that has quietly stopped being true
  # fails here instead of on a user's machine.
  lowest-deps:
    name: tests (lowest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          activate-environment: true

      - name: Install
        run: uv pip install --resolution lowest-direct -e ".[dev]"

      - name: Test
        run: pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check
        run: mypy
